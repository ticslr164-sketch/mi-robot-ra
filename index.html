```html
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mi Robot en Realidad Aumentada</title>

    <!-- A-Frame -->
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>

    <!-- AR.js -->
    <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.5/aframe/build/aframe-ar.js"></script>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Botones de interacción -->
    <div id="controles">
        <button onclick="moverRobot()">Mover</button>
        <button onclick="agrandarRobot()">Aumentar</button>
        <button onclick="reducirRobot()">Reducir</button>
        <button onclick="rotarRobot()">Rotar</button>
    </div>

    <!-- Escena de Realidad Aumentada -->
    <a-scene
        embedded
        vr-mode-ui="enabled: false"
        arjs="sourceType: webcam; debugUIEnabled: false;">

        <!-- Marcador Hiro -->
        <a-marker preset="hiro">

            <!-- Robot -->
            <a-entity id="robot"
                position="0 0 0"
                scale="1 1 1"
                rotation="0 0 0"
                class="clickable"
                onclick="cambiarColor()">

                <!-- Cuerpo -->
                <a-box
                    id="cuerpo"
                    position="0 1.3 0"
                    width="1"
                    height="1.2"
                    depth="0.7"
                    color="#2196F3">
                </a-box>

                <!-- Cabeza -->
                <a-box
                    position="0 2.2 0"
                    width="0.8"
                    height="0.7"
                    depth="0.7"
                    color="#BDBDBD">
                </a-box>

                <!-- Ojo izquierdo -->
                <a-sphere
                    position="-0.2 2.25 0.36"
                    radius="0.08"
                    color="#00FF00">
                </a-sphere>

                <!-- Ojo derecho -->
                <a-sphere
                    position="0.2 2.25 0.36"
                    radius="0.08"
                    color="#00FF00">
                </a-sphere>

                <!-- Brazo izquierdo -->
                <a-box
                    position="-0.7 1.35 0"
                    width="0.25"
                    height="0.9"
                    depth="0.25"
                    color="#757575">
                </a-box>

                <!-- Brazo derecho -->
                <a-box
                    position="0.7 1.35 0"
                    width="0.25"
                    height="0.9"
                    depth="0.25"
                    color="#757575">
                </a-box>

                <!-- Pierna izquierda -->
                <a-box
                    position="-0.25 0.45 0"
                    width="0.3"
                    height="0.7"
                    depth="0.3"
                    color="#424242">
                </a-box>

                <!-- Pierna derecha -->
                <a-box
                    position="0.25 0.45 0"
                    width="0.3"
                    height="0.7"
                    depth="0.3"
                    color="#424242">
                </a-box>

            </a-entity>

            <!-- Piso / referencia visual -->
            <a-plane
                position="0 0 0"
                rotation="-90 0 0"
                width="3"
                height="3"
                color="#4CAF50"
                opacity="0.7">
            </a-plane>

        </a-marker>

        <!-- Cámara -->
        <a-entity camera></a-entity>

    </a-scene>

    <script src="script.js"></script>

</body>
</html>
```
